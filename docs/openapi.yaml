openapi: 3.1.0
info:
  description: Records transactions and processes them asynchronously via a transactional
    outbox and Kafka. Creation returns 202 with status PENDING; poll GET until SUCCESS.
    Errors are RFC 7807 ProblemDetail (application/problem+json).
  title: Transaction API
  version: v1
servers:
- description: Default server
  url: http://localhost:8080
tags:
- description: "People who have transacted, identified by a normalized phone number"
  name: Members
- description: Create transactions and track their asynchronous processing
  name: Transactions
paths:
  /members:
    get:
      description: Newest first. Members are created automatically by their first
        transaction. Phone numbers are masked because this list is public.
      operationId: listMembers
      parameters:
      - description: How many to return (1-50)
        example: 10
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberSummary"
          description: Members
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: limit is outside 1..50
      summary: List members
      tags:
      - Members
  /members/{id}:
    get:
      operationId: getMember
      parameters:
      - description: "Member ID, e.g. from a transaction's memberId"
        example: b1c7e4a2-8f3d-4e5a-9c61-2d7f0a3b8e94
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
          description: Member found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: ID is not a valid UUID
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Member not found
      summary: Get a member and their recent transactions
      tags:
      - Members
  /transactions:
    get:
      description: Newest first. Phone numbers are masked because this list is public.
      operationId: listRecentTransactions
      parameters:
      - description: How many to return (1-50)
        example: 10
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 10
          maximum: 50
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionSummary"
          description: Recent transactions
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: limit is outside 1..50
      summary: List recent transactions
      tags:
      - Transactions
    post:
      description: "Stores the transaction as PENDING and queues it for asynchronous\
        \ processing. Poll GET /transactions/{id} until the status is SUCCESS or FAILED.\
        \ Send an Idempotency-Key to make retries safe: repeating a request with the\
        \ same key and body returns the original transaction instead of creating a\
        \ new one."
      operationId: createTransaction
      parameters:
      - description: "Optional client-generated key, 1-255 visible ASCII characters\
          \ (a UUID per logical request is recommended)"
        example: 6f1c2b9e-3d4a-4c3e-9a51-0d2f7b8e4c11
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          maxLength: 255
          minLength: 1
          pattern: "[\\x21-\\x7E]+"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRequest"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
          description: Accepted; processing is asynchronous. A repeated Idempotency-Key
            returns the existing transaction in its current state
          headers:
            Idempotent-Replayed:
              description: '"true" when the response is a replay for a repeated Idempotency-Key'
              schema:
                type: string
                enum:
                - "true"
              style: simple
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Validation failed, malformed JSON or malformed Idempotency-Key;\
            \ `errors` maps field or header to message"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Invoice already exists, or the Idempotency-Key was already\
            \ used with a different request"
      summary: Create a transaction
      tags:
      - Transactions
  /transactions/{id}:
    get:
      operationId: getTransaction
      parameters:
      - description: Transaction ID returned on creation
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
          description: Transaction found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: ID is not a valid UUID
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Transaction not found
      summary: Get a transaction by ID
      tags:
      - Transactions
components:
  schemas:
    CreateRequest:
      type: object
      description: Request to create a transaction
      properties:
        amount:
          type: number
          description: Positive amount with at most 2 decimal places
          example: 12500.0
          minimum: 0.01
        invoice:
          type: string
          description: Unique invoice number; reusing one returns 409
          example: INV-001
          maxLength: 100
          minLength: 0
        phoneNumber:
          type: string
          description: "Indonesian phone number. Accepts 0812…, +62 812… or 62812…\
            \ (spaces, dashes, dots and parentheses are ignored); stored and returned\
            \ as 62…, and used to find or create the member"
          example: "08123456789"
          maxLength: 30
          minLength: 0
      required:
      - amount
      - invoice
      - phoneNumber
    MemberDetail:
      type: object
      description: "A member with the full phone number and their most recent transactions\
        \ (newest first, up to 50)"
      properties:
        createdAt:
          type: string
          format: date-time
          example: 2026-11-20T09:00:00Z
        id:
          type: string
          format: uuid
          example: b1c7e4a2-8f3d-4e5a-9c61-2d7f0a3b8e94
        phoneNumber:
          type: string
          description: Normalized phone number
          example: 628123456789
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/TransactionSummary"
    MemberSummary:
      type: object
      description: A member in the public list; the phone number is masked
      properties:
        createdAt:
          type: string
          format: date-time
          example: 2026-11-20T09:00:00Z
        id:
          type: string
          format: uuid
          example: b1c7e4a2-8f3d-4e5a-9c61-2d7f0a3b8e94
        phoneNumber:
          type: string
          example: 6281*****789
    ProblemDetail:
      type: object
      description: RFC 7807 problem details
      properties:
        detail:
          type: string
          example: Request validation failed
        errors:
          type: object
          additionalProperties:
            type: string
          description: Field name to validation message; present only on validation
            errors
          example:
            amount: must be greater than or equal to 0.01
        instance:
          type: string
          format: uri
          example: /transactions
        status:
          type: integer
          format: int32
          example: 400
        title:
          type: string
          example: Bad Request
        type:
          type: string
          format: uri
          example: about:blank
    TransactionResponse:
      type: object
      description: A transaction and its processing status
      properties:
        amount:
          type: number
          example: 12500.0
        completedAt:
          type: string
          format: date-time
          description: When the transaction reached SUCCESS or FAILED; null while
            PENDING
          example: 2026-11-14T10:16:02Z
        createdAt:
          type: string
          format: date-time
          example: 2026-11-14T10:15:30Z
        failureReason:
          type: string
          description: Why the transaction failed; present only when FAILED
          example: "Amount exceeds the processor limit of 100,000,000.00"
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        invoice:
          type: string
          example: INV-001
        memberId:
          type: string
          format: uuid
          description: Member who made the transaction; null for transactions created
            before members existed
          example: b1c7e4a2-8f3d-4e5a-9c61-2d7f0a3b8e94
        phoneNumber:
          type: string
          description: Normalized phone number
          example: 628123456789
        publishedAt:
          type: string
          format: date-time
          description: When the outbox relay handed the event to the broker; null
            until then
          example: 2026-11-14T10:16:00Z
        status:
          type: string
          description: "PENDING until processed, then SUCCESS or FAILED (both terminal)"
          enum:
          - PENDING
          - SUCCESS
          - FAILED
          example: PENDING
    TransactionSummary:
      type: object
      description: A transaction in the recent list; the phone number is masked because
        the list is public
      properties:
        amount:
          type: number
          example: 12500.0
        createdAt:
          type: string
          format: date-time
          example: 2026-11-14T10:15:30Z
        id:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        invoice:
          type: string
          example: INV-001
        phoneNumber:
          type: string
          example: 6281*****789
        status:
          type: string
          enum:
          - PENDING
          - SUCCESS
          - FAILED
          example: SUCCESS
