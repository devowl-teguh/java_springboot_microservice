spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    default-schema: transaction_service
    schemas: transaction_service
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: transaction_service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: transaction-processor-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
app:
  kafka:
    topic: ${KAFKA_TOPIC:transactions-v1}
