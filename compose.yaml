# Local development stack.
#   docker compose up -d                          Kafka only (use with ./mvnw spring-boot:run and Supabase)
#   docker compose --profile local-db up -d       + local Postgres on localhost:5433
#   docker compose --profile app up -d --build    + the app itself on localhost:8080 (no JDK needed)
# Stop with: docker compose --profile local-db --profile app down   (add -v to wipe Kafka/Postgres data)

services:
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used by other containers (kafka:19092); EXTERNAL by apps on the Mac (localhost:9092).
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job: creates the main topic and its dead-letter topic with the same partition count.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in transactions-v1 transactions-v1.DLT; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$t" --partitions 3 --replication-factor 1
        done
    restart: "no"

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: transactions
      POSTGRES_PASSWORD: transactions
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transactions -d transactions"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    profiles: ["app"]
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker, "localhost" is the container itself, so reach Kafka/Postgres by service name.
      # APP_DB_URL (set in .env) overrides DB_URL for this container only, e.g. for the local-db Postgres.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DB_URL: ${APP_DB_URL:-${DB_URL:?Set DB_URL (and APP_DB_URL for local-db) in .env}}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false

volumes:
  kafka-data:
  postgres-data:
