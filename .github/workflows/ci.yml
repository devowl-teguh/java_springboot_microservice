name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ['web/**', 'docs/**/*.md', '*.md']
  pull_request:
    paths-ignore: ['web/**', 'docs/**/*.md', '*.md']

jobs:
  unit-tests:
    name: Unit tests (mocks only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Surefire's default includes skip *IT classes, so no Docker/Postgres/Kafka is needed here.
      - run: mvn -B test
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports

  package:
    name: Build jar
    needs: unit-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B package -DskipTests
      - uses: actions/upload-artifact@v6
        with:
          name: transactions-jar
          path: target/*.jar
          retention-days: 14
